# Header-stripping hop for /api/mapillary/* ONLY (oauth2-proxy routes that
# prefix here; everything else goes straight to godseye-app).
#
# Upstream's cross-site gate (src/localRequestGate.mjs) refuses any request that
# carries a reverse-proxy header, and every request here comes through Traefik
# and oauth2-proxy. Authentication has already happened by the time a request
# reaches this hop, and the gate's Sec-Fetch-Site/Origin checks still run, so
# stripping the forwarding headers removes only the "came through a proxy"
# signal. Keep this scoped to Mapillary: OpenAI and Google stay blocked.

server {
    listen 8080;

    location /api/mapillary/ {
        proxy_pass http://godseye-app:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Exactly the PROXY_SIGNALS list in src/localRequestGate.mjs.
        proxy_set_header Forwarded "";
        proxy_set_header Via "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Ray "";
    }

    location / {
        return 404;
    }
}
